<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ShoePee | Register</title>
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body>
  <div class="auth-container">
    <h1>Create Account</h1>
    <form id="registerForm">
      <input type="text" id="fullname" placeholder="Full Name" required>
      <input type="email" id="email" placeholder="Email" required>
      <input type="text" id="username" placeholder="Username" required>
      <input type="password" id="password" placeholder="Password" required>
      <input type="password" id="confirmPassword" placeholder="Confirm Password" required>
      <select id="role" required>
        <option value="">Select Role</option>
        <option value="buyer">Shoe Buyer</option>
        <option value="seller">Shoe Seller</option>
      </select>
      <div id="sellerFields" style="display:none;">
        <input type="text" id="govID" placeholder="Government ID">
        <input type="text" id="dtiNumber" placeholder="DTI Number">
      </div>
      <button class="btn" type="submit">Register</button>
    </form>
    <p>Already have an account? <a href="login.html">Login</a></p>
  </div>
  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
