<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ShoePee | Seller Dashboard</title>
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/seller.css">
</head>

<body>

<div id="navbar"></div>

<section class="seller-dashboard">

  <h2 class="dash-title">Seller Dashboard</h2>

  <div class="dash-stats">
    <div class="stat-card">
      <h3>Total Products</h3>
      <p id="totalProducts">0</p>
    </div>
    <div class="stat-card">
      <h3>Total Sales</h3>
      <p id="totalSales">₱0</p>
    </div>
    <div class="stat-card">
      <h3>Total Orders</h3>
      <p id="totalOrders">0</p>
    </div>
    <div class="stat-card warning">
      <h3>Low Stock</h3>
      <p id="lowStockCount">0</p>
    </div>
  </div>

  <div class="product-controls">
    <button class="btn-primary" id="addProductBtn">Add Product</button>
    <input type="text" id="searchProduct" placeholder="Search your shoes...">
  </div>

  <div id="productList" class="product-list"></div>

</section>

<div id="footer"></div>

<script src="js/data.js"></script> 
<script src="js/utils.js"></script>
<script src="js/seller.js"></script>

<!-- Add Product Modal -->
<div class="modal" id="productModal">
  <div class="modal-content">
    <h3>Add New Product</h3>

    <!-- ✅ make this a form -->
    <form id="addProductForm">

      <input type="text" id="pName" placeholder="Product name" required>
      <input type="number" id="pPrice" placeholder="Price" required>

      <select id="pCategory" required>
        <option value="" disabled selected>Select Category</option>
        <option value="men">Men</option>
        <option value="women">Women</option>
        <option value="sport">Sport</option>
      </select>

      <input type="text" id="pImage" placeholder="Image path (assets/images/...)" required>
      <input type="number" id="pStock" placeholder="Stock quantity" required>

      <div class="modal-actions">
        <button type="submit" id="saveProduct" class="btn-primary">Save</button>
        <button type="button" id="closeModal">Cancel</button>
      </div>

    </form>
  </div>
</div>

<!-- View Product Modal -->
<div class="modal" id="viewModal">
  <div class="modal-content view-modal modern-view">

    <div class="view-header">
      <h3>Product Details</h3>
      <span class="close-view" id="closeView">&times;</span>
    </div>

    <div class="view-body">
      <img id="viewImage" class="view-img">

      <h2 id="viewName" class="view-name"></h2>

      <div class="view-grid">
        <div class="info-box">
          <span>Price</span>
          <p id="viewPrice"></p>
        </div>

        <div class="info-box">
          <span>Stock</span>
          <p id="viewStock"></p>
        </div>

        <div class="info-box">
          <span>Purchases</span>
          <p id="viewPurchases"></p>
        </div>

        <div class="info-box">
          <span>Category</span>
          <p id="viewCategory"></p>
        </div>
      </div>
    </div>

    <div class="view-actions">
      <button id="removeProductBtn" class="btn-remove">Remove Product</button>
    </div>

  </div>
</div>

</body>
</html>
